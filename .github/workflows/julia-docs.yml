name: Julia docs

on:
  push:
    branches:
      - main
    paths:
      - "julia/docs/**"
      - "julia/src/**"
      - "julia/*.toml"
      - .github/workflows/julia-docs.yml
    tags: ["*"]
  pull_request:
    branches:
      - main
    paths:
      - "julia/docs/**"
      - "julia/src/**"
      - "julia/*.toml"
      - .github/workflows/julia-docs.yml
    types: [opened, synchronize, reopened]

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1"
          project: './julia'
      - name: Use Julia cache
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - name: Instantiate environment with development version of the package
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
        working-directory: julia
      - name: Run doctest
        run: |
          julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using RemoteBMI
            DocMeta.setdocmeta!(RemoteBMI, :DocTestSetup, :(using RemoteBMI); recursive=true)
            doctest(RemoteBMI)'
        working-directory: julia
      - name: Build documentation
        run: julia --project=docs docs/make.jl
        working-directory: julia
        env:
          JULIA_PKG_SERVER: ""
          GKSwstype: "100" # https://discourse.julialang.org/t/generation-of-documentation-fails-qt-qpa-xcb-could-not-connect-to-display/60988
