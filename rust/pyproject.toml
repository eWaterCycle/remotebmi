[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "remotebmi-rs"
description = "Rust HTTP server and client transport for remotebmi (experimental)"
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]
